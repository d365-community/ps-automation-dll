name: msbuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    
    runs-on: windows-latest
    
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: setup-msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.1

      - name: Navigate to Workspace
        run: cd $GITHUB_WORKSPACE

      - name: Restore Packages
        run: nuget restore ps-automation-dll.sln

      - name: Build
        run: msbuild ps-automation-dll.sln /p:Configuration=Release

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
            name: ps-automation
            path: |
              bin/Release/ps-automation.dll
              bin/Release/CommandLine.dll
              bin/Release/starter.exe
            if-no-files-found: error
